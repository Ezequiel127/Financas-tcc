spring.datasource.url=jdbc:postgresql://localhost:5432/financas_tcc
spring.datasource.username=financas_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

app.password-reset.mail-from=${MAIL_FROM:no-reply@localhost}
app.password-reset.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
